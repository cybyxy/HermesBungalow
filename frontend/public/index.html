<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>计算器 | Calculator</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 主计算器卡片 -->
      <main class="calculator-card">
        <!-- 显示屏 -->
        <div class="display-section">
          <div class="expression-bar" id="expressionBar"></div>
          <div class="result-bar" id="resultBar">0</div>
        </div>

        <!-- 功能键行 -->
        <div class="function-row">
          <button class="btn btn-fn" data-action="clear">AC</button>
          <button class="btn btn-fn" data-action="toggle-sign">+/−</button>
          <button class="btn btn-fn" data-action="percent">%</button>
          <button class="btn btn-op" data-action="operator" data-value="÷">÷</button>
        </div>

        <!-- 数字键区 (4行×4列) -->
        <div class="keypad">
          <button class="btn btn-num" data-action="digit" data-value="7">7</button>
          <button class="btn btn-num" data-action="digit" data-value="8">8</button>
          <button class="btn btn-num" data-action="digit" data-value="9">9</button>
          <button class="btn btn-op" data-action="operator" data-value="×">×</button>

          <button class="btn btn-num" data-action="digit" data-value="4">4</button>
          <button class="btn btn-num" data-action="digit" data-value="5">5</button>
          <button class="btn btn-num" data-action="digit" data-value="6">6</button>
          <button class="btn btn-op" data-action="operator" data-value="−">−</button>

          <button class="btn btn-num" data-action="digit" data-value="1">1</button>
          <button class="btn btn-num" data-action="digit" data-value="2">2</button>
          <button class="btn btn-num" data-action="digit" data-value="3">3</button>
          <button class="btn btn-op" data-action="operator" data-value="+">+</button>

          <button class="btn btn-num btn-zero" data-action="digit" data-value="0">0</button>
          <button class="btn btn-num" data-action="decimal">.</button>
          <button class="btn btn-eq" data-action="equals">=</button>
        </div>

        <!-- 历史记录面板 -->
        <div class="history-panel">
          <div class="history-header">
            <span>历史记录</span>
            <button class="btn-history-clear" id="clearHistory">清除</button>
          </div>
          <ul class="history-list" id="historyList">
            <!-- 动态注入 -->
          </ul>
          <div class="history-empty" id="historyEmpty">暂无记录</div>
        </div>

        <!-- 历史切换按钮 -->
        <button class="btn-history-toggle" id="historyToggle" aria-label="切换历史记录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12,6 12,12 16,14"/>
          </svg>
        </button>
      </main>
    </div>

    <!-- 音效反馈 -->
    <audio id="clickSound" preload="auto">

    </audio>

    <script src="/app.js"></script>
  </body>
</html>
