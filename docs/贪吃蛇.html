<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(15, 52, 96, 0.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const COLS = 20, ROWS = 20, CELL = 24;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL + 30;

let snake, dir, food, score, gameOver, speed, interval;

function init() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  speed = 150;
  placeFood();
  if (interval) clearInterval(interval);
  interval = setInterval(step, speed);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    clearInterval(interval);
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // score bar
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, 30);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('分数: ' + score, canvas.width / 2, 15);

  // grid
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 30);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * CELL + 30);
    ctx.lineTo(canvas.width, i * CELL + 30);
    ctx.stroke();
  }

  // food
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 32, CELL - 4, CELL - 4);

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#00ff88' : '#00cc66';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 31, CELL - 2, CELL - 2);
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('分数: ' + score + '  按 R 重新开始', canvas.width / 2, canvas.height / 2 + 15);
  }
}

document.addEventListener('keydown', e => {
  if (gameOver) {
    if (e.key === 'r' || e.key === 'R') init();
    return;
  }
  switch (e.key) {
    case 'ArrowUp':    if (dir.y !== 1)  dir = {x: 0, y: -1}; break;
    case 'ArrowDown':  if (dir.y !== -1) dir = {x: 0, y: 1};  break;
    case 'ArrowLeft':  if (dir.x !== 1)  dir = {x: -1, y: 0}; break;
    case 'ArrowRight': if (dir.x !== -1) dir = {x: 1, y: 0};  break;
  }
});

init();
</script>
</body>
</html>
