<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Hermes数字工作室 - 完整原型</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0a15; color: #eee; font-family: Consolas, 'Microsoft YaHei', monospace; overflow: hidden; }
  canvas { display: block; }
  
  /* 弹窗 */
  .popup-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;

    z-index: 1000;
  }
  .popup-overlay.show { display: flex; }
  .popup {
    background: #1a1a30; border: 2px solid #FFD700; border-radius: 12px;

  }
  .popup-header {
    background: #252540; padding: 12px 16px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid #333; flex-shrink: 0;
  }
  .popup-title { color: #FFD700; font-size: 14px; font-weight: bold; }
  .popup-subtitle { color: #888; font-size: 11px; margin-top: 4px; }
  .popup-close { color: #888; font-size: 18px; cursor: pointer; padding: 0 8px; }
  .popup-close:hover { color: #FFD700; }
  .popup-header-actions { display: flex; align-items: center; gap: 6px; }
  .popup-header-btn { display: none; padding: 4px 10px; font-size: 11px; border-radius: 4px; border: 1px solid #3a7a3a; background: #2a5a2a; color: #fff; cursor: pointer; }
  .popup-content { padding: 16px; flex: 1; overflow-y: auto; }
  .popup-content::-webkit-scrollbar { width: 6px; }
  .popup-content::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .popup-footer { padding: 12px 16px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; }
  
  /* 标签页 */
  .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 16px; }
  .tab { padding: 8px 16px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 12px; }
  .tab:hover { color: #ccc; }
  .tab.active { color: #FFD700; border-bottom-color: #FFD700; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* 进度条 */
  .progress-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #228B22; transition: width 0.3s; }
  .progress-fill.warning { background: #FF8C00; }
  .progress-fill.danger { background: #DC143C; }
  
  /* 属性条 */
  .stat-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .stat-label { width: 60px; font-size: 10px; color: #888; }
  .stat-bar-inner { flex: 1; height: 6px; background: #333; border-radius: 3px; }
  .stat-bar-fill { height: 100%; border-radius: 3px; }
  .stat-value { width: 35px; font-size: 10px; color: #aaa; text-align: right; }
  
  /* 标签 */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
  .tag-green { background: #1a3a1a; color: #90EE90; }
  .tag-blue { background: #1a2a3a; color: #87CEEB; }
  .tag-yellow { background: #3a3a1a; color: #FFD700; }
  .tag-red { background: #3a1a1a; color: #ff6b6b; }
  .tag-purple { background: #2a1a3a; color: #DDA0DD; }
  
  /* 按钮 */
  .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid #444; transition: all 0.2s; }
  .btn-primary { background: #2a5a2a; color: #fff; border-color: #3a7a3a; }
  .btn-primary:hover { background: #3a6a3a; }
  .btn-secondary { background: #2a3a5a; color: #ccc; }
  .btn-secondary:hover { background: #3a4a6a; }
  .btn-danger { background: #5a2a2a; color: #ff6b6b; border-color: #7a3a3a; }
  .btn-danger:hover { background: #6a3a3a; }
  .btn-icon { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; }
  
  /* 表单 */
  .form-group { margin-bottom: 12px; }
  .form-label { display: block; color: #aaa; font-size: 11px; margin-bottom: 4px; }
  .form-input { width: 100%; padding: 8px 12px; background: #0a0a15; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 12px; box-sizing: border-box; }
  .form-input:focus { outline: none; border-color: #FFD700; }
  .form-textarea { width: 100%; padding: 10px 12px; background: #0a0a15; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 12px; line-height: 1.5; box-sizing: border-box; resize: vertical; }
  .form-textarea:focus { outline: none; border-color: #FFD700; }
  .form-select { width: 100%; padding: 8px 12px; background: #0a0a15; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 12px; }
  
  /* 列表项 */
  .list-item { padding: 10px 12px; background: #252540; border-radius: 4px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; }
  .list-item:hover { background: #2a2a4a; }
  .list-item.selected { background: #3a4a6a; border: 1px solid #FFD700; }
  
  /* 网格 */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  
  /* 菜单 */
  .menu-popup { position: fixed; background: rgba(20, 20, 40, 0.98); border: 2px solid #FFD700; border-radius: 8px; padding: 8px 0; min-width: 220px; max-height: 500px; overflow-y: auto; box-shadow: 0 5px 30px rgba(0,0,0,0.5); z-index: 1000; }
  .menu-popup::-webkit-scrollbar { width: 6px; }
  .menu-popup::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .menu-header { padding: 8px 16px; color: #FFD700; font-size: 11px; border-bottom: 1px solid #333; margin-bottom: 4px; }
  .menu-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px; transition: background 0.15s; }
  .menu-item:hover { background: rgba(255, 215, 0, 0.15); }
  .menu-item.disabled { color: #555; cursor: not-allowed; }
  .menu-item.disabled:hover { background: transparent; }
  .menu-separator { height: 1px; background: #333; margin: 6px 0; }
  .menu-hotkey { color: #666; font-size: 10px; margin-left: auto; }
  
  .tooltip { position: fixed; background: rgba(26,26,48,0.95); border: 1px solid #FFD700; padding: 8px 12px; border-radius: 4px; font-size: 11px; pointer-events: none; display: none; z-index: 1001; color: #fff; max-width: 300px; }

  .tab-btn:hover { color: #ccc; }
  .tab-btn.active { color: #FFD700; border-bottom-color: #FFD700; background: #1a1a30; }
</style>
</head>

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.style.position = 'absolute';
  canvas.style.left = (window.innerWidth - W * scale) / 2 + 'px';
  canvas.style.top = (window.innerHeight - H * scale) / 2 + 'px';
  syncOverlayToCanvas();
}

function syncOverlayToCanvas() {
  const overlay = document.getElementById('popupOverlay');
  const rect = canvas.getBoundingClientRect();
  overlay.style.left = rect.left + 'px';
  overlay.style.top = rect.top + 'px';
  overlay.style.width = rect.width + 'px';
  overlay.style.height = rect.height + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

  taskCompetition:{
    title:'🎲 任务竞争',
    width:450,
    render:()=>{
      const competitors=state.agents.filter(a=>a.profession==='设计师');
      if(competitors.length<2){
        return`<div style="text-align:center;padding:40px;"><div style="font-size:48px;margin-bottom:16px;">🎰</div><div style="color:#888;font-size:14px;">没有足够的同职业Agent竞争此任务</div></div>`;
      }
      const winnerIdx=Math.floor(Math.random()*competitors.length);
      const winner=competitors[winnerIdx];
      const loser=competitors.find(a=>a.id!==winner.id);
      const moodGain=8+Math.floor(Math.random()*8);
      const moodLoss=5+Math.floor(Math.random()*6);
      if(winner){winner.mood=Math.min(100,winner.mood+moodGain);}
      if(loser){loser.mood=Math.max(0,loser.mood-moodLoss);}
      return`<div style="text-align:center;padding:20px;">
        <div style="font-size:48px;margin-bottom:16px;">🎰</div>
        <div style="color:#FFD700;font-size:16px;font-weight:bold;margin-bottom:8px;">纯随机抽签</div>
        <div style="color:#888;font-size:12px;margin-bottom:20px;">职业: ${winner.profession} · ${competitors.length}人竞争</div>
        <div style="display:flex;justify-content:center;gap:40px;">
          ${competitors.map(c=>`<div style="text-align:center;${c.id===winner.id?'opacity:1;':'opacity:0.5;'}">
            <div style="width:60px;height:60px;background:${c.id===winner.id?'#FFD700':'#555'};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;${c.id===winner.id?'box-shadow:0 0 20px #FFD700;':''}">${c.name[0]}</div>
            <div style="color:#fff;font-size:12px;">${c.name}</div>
            <div style="color:${c.id===winner.id?'#FFD700':'#888'};font-size:10px;">${c.id===winner.id?'✓ 赢家':'✗ 抽签落选'}</div>
          </div>`).join('')}
        </div>
        <div style="margin-top:24px;padding:16px;background:#1a2a3a;border-radius:8px;">
          <div style="color:#90EE90;font-size:14px;">🎉 ${winner.name} 抽中了任务！</div>
          <div style="color:#aaa;font-size:12px;margin-top:8px;">情绪 +${moodGain}</div>
          ${loser?`<div style="color:#ff6b6b;font-size:12px;margin-top:4px;">${loser.name} 未抽中... 情绪 -${moodLoss}</div>`:''}
        </div>
        <div style="margin-top:12px;padding:10px;background:#0a0a15;border-radius:6px;">
          <div style="color:#666;font-size:10px;line-height:1.5;">
            💡 若赢家任务完成差：情绪额外加倍扣除<br>
            ⚠️ 竞争通过WebSocket广播给所有Agent
          </div>
        </div>
      </div>`;
    },
    buttons:[{label:'确定',class:'btn-primary',action:'close'}]

  relationMap:{
    title:'🗺️ 关系图谱',

    render:()=>{
      const center={x:350,y:130},radius=110;
      const nodes=state.agents.map((a,i)=>{const angle=(-Math.PI/2)+(i*(Math.PI*2/state.agents.length));return{...a,x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius};});
      const getRelStyle=(rel)=>{if(rel>=71)return{color:'#22c55e',width:3,stage:'挚友'};if(rel>=31)return{color:'#eab308',width:2.3,stage:'朋友'};if(rel>=11)return{color:'#f97316',width:1.6,stage:'认识'};return{color:'#666',width:1,stage:'陌生'};};
      let svgInner='';
      nodes.forEach((a,i)=>{nodes.forEach((b,j)=>{if(j<=i)return;const rel=Math.round((a.relation+b.relation)/2);const style=getRelStyle(rel);svgInner+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${style.color}" stroke-width="${style.width}" opacity="0.55"/>`;});});
      nodes.forEach(n=>{const style=getRelStyle(n.relation);svgInner+=`<line x1="${center.x}" y1="${center.y}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${style.color}" stroke-width="1" opacity="0.22"/>`;});
      svgInner+=`<circle cx="${center.x}" cy="${center.y}" r="22" fill="#4169E1" stroke="#FFD700" stroke-width="3"/><text x="${center.x}" y="${center.y+5}" text-anchor="middle" fill="#FFD700" font-size="18" font-family="Consolas">👑</text><text x="${center.x}" y="${center.y+40}" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold" font-family="Consolas">城主</text>`;

function openPopup(key){
  const popup=POPUPS[key];
  if(!popup)return;
  selectedPopup=key;
  document.getElementById('popupTitle').textContent=popup.title;
  document.getElementById('popupSubtitle').textContent=popup.subtitle||'';
  document.getElementById('popupBody').innerHTML=popup.render();
  const footer=document.getElementById('popupFooter');
  footer.innerHTML='';
  (popup.buttons||[]).forEach(btn=>{
    const el=document.createElement('button');
    el.className='btn '+btn.class;
    el.textContent=btn.label;
    el.onclick=()=>{if(actions[btn.action])actions[btn.action]();};
    footer.appendChild(el);
  });
  document.getElementById('popupOverlay').classList.add('show');
  syncOverlayToCanvas();
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  selectedPopup=null;
}

window.switchTab=function(btn,tabId){
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  btn.closest('.popup').querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  const content=btn.closest('.popup').querySelector('#tab-'+tabId);
  if(content)content.classList.add('active');
};

window.switchBuildingTab=function(btn,type){
  btn.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
};

window.selectAgentFromList=function(id){
  selectedAgent=state.agents.find(a=>a.id===id);
  closePopup();
  log(`选中了 ${selectedAgent?.name}`);
};

window.useSkill=function(skill){
  if(skill==='inspire'){
    if(selectedAgent){selectedAgent.energy=Math.min(100,selectedAgent.energy+30);selectedAgent.mood=Math.min(100,selectedAgent.mood+15);}
    else{state.agents.forEach(a=>{a.energy=Math.min(100,a.energy+10);a.mood=Math.min(100,a.mood+5);});}
    log('📣 使用激励演说');
  }else if(skill==='insight'){
    log('🔮 使用灵感赐予');
  }
};

// ===== 建筑 =====
function drawBuilding(){
  const corridorCenterX=ROOM_W*2+WALL*2+WALL/2;
  const corridorX=corridorCenterX-VISUAL_CORRIDOR_W/2;
  const doorX=corridorCenterX-DOOR/2;
  buildingOffsetX=CENTER_X+(CENTER_W-BUILDING_W)/2;
  buildingOffsetY=CENTER_Y+(CENTER_H-BUILDING_H);
  ctx.save();
  ctx.translate(buildingOffsetX,buildingOffsetY);
  const kingX=(BUILDING_W-KING_W)/2;
  rect(kingX,0,KING_W,KING_H,C.king);
  stroke(kingX,0,KING_W,KING_H,'#4169E1',3);
  text('城主办公室',kingX+KING_W/2,KING_H/2+4,'#fff',12,'center');
  rect(doorX,KING_H,DOOR,WALL,C.door);
  clickables.push({x:buildingOffsetX+kingX,y:buildingOffsetY,w:KING_W,h:KING_H,action:'kingOffice',tooltip:'城主办公室'});
  rect(doorX,KING_H+WALL,DOOR,V_CORR_H,C.floor);
  const row2Y=KING_H+WALL+V_CORR_H+WALL;
  drawRow(0,row2Y,['休息室','资料室','会议室','机房'],[true,true,true,true]);
  rect(corridorX,row2Y,VISUAL_CORRIDOR_W,ROOM_H,C.floor);
  rect(0,row2Y+ROOM_H,corridorX+VISUAL_CORRIDOR_W,MID_CORRIDOR_H,C.floor);
  rect(corridorX+VISUAL_CORRIDOR_W,row2Y+ROOM_H,BUILDING_W-(corridorX+VISUAL_CORRIDOR_W),MID_CORRIDOR_H,C.floor);
  const row3Y=row2Y+ROOM_H+MID_CORRIDOR_H+WALL;
  drawRow(0,row3Y,['办公室1','办公室2','办公室3','办公室4'],[false,false,false,false]);
  rect(corridorX,row3Y,VISUAL_CORRIDOR_W,ROOM_H,C.floor);
  rect(0,row3Y+ROOM_H,corridorX+VISUAL_CORRIDOR_W,MID_CORRIDOR_H,C.floor);
  rect(corridorX+VISUAL_CORRIDOR_W,row3Y+ROOM_H,BUILDING_W-(corridorX+VISUAL_CORRIDOR_W),MID_CORRIDOR_H,C.floor);
  const row4Y=row3Y+ROOM_H+MID_CORRIDOR_H+WALL;
  drawRow(0,row4Y,['办公室5','办公室6','办公室7','办公室8'],[false,false,false,false]);
  rect(corridorX,row4Y,VISUAL_CORRIDOR_W,ROOM_H,C.floor);
  rect(0,row4Y+ROOM_H,corridorX+VISUAL_CORRIDOR_W,BOTTOM_CORRIDOR_H,C.floor);
  rect(corridorX+VISUAL_CORRIDOR_W,row4Y+ROOM_H,BUILDING_W-(corridorX+VISUAL_CORRIDOR_W),BOTTOM_CORRIDOR_H,C.floor);

function drawRow(offsetX,y,labels,isFixed){
  for(let i=0;i<4;i++){
    const x=offsetX+i*(ROOM_W+WALL);
    const color=isFixed[i]?C.fixed:C.dynamic;
    const borderColor=isFixed[i]?'#4169E1':'#228B22';
    rect(x,y,ROOM_W,ROOM_H,color);
    stroke(x,y,ROOM_W,ROOM_H,borderColor,2);
    text(labels[i],x+ROOM_W/2,y+ROOM_H/2,'#fff',9,'center');
    const doorX=i===0||i===2?x+ROOM_W*3/4-DOOR/2:x+ROOM_W/4-DOOR/2;
    rect(doorX,y+ROOM_H-WALL,DOOR,WALL,C.door);
    clickables.push({x:buildingOffsetX+x,y:buildingOffsetY+y,w:ROOM_W,h:ROOM_H,action:'room',roomName:labels[i],tooltip:labels[i]+'\n点击移动选中的Agent'});
  }
}

function drawAgentsInBuilding(row2Y,row3Y,row4Y){
  const roomPositions={'休息室':{row:row2Y,col:0,offsetX:40},'资料室':{row:row2Y,col:1,offsetX:40},'会议室':{row:row2Y,col:2,offsetX:40},'机房':{row:row2Y,col:3,offsetX:40},'办公室1':{row:row3Y,col:0,offsetX:40},'办公室2':{row:row3Y,col:1,offsetX:40},'办公室3':{row:row3Y,col:2,offsetX:40},'办公室4':{row:row3Y,col:3,offsetX:40},'办公室5':{row:row4Y,col:0,offsetX:40},'办公室6':{row:row4Y,col:1,offsetX:40},'办公室7':{row:row4Y,col:2,offsetX:40},'办公室8':{row:row4Y,col:3,offsetX:40}};
  state.agents.forEach(agent=>{
    const pos=roomPositions[agent.location];
    if(!pos)return;
    const roomX=pos.col*(ROOM_W+WALL);
    const ax=buildingOffsetX+roomX+pos.offsetX;
    const ay=buildingOffsetY+pos.row+ROOM_H-30;
    agent.renderX=ax;agent.renderY=ay;
    const isSelected=selectedAgent?.id===agent.id;
    const isHovered=hoveredItem===agent;
    ctx.fillStyle=isSelected?'#5a7a9a':isHovered?'#5179b1':C.agent;
    ctx.fillRect(ax-AGENT_W/2,ay-AGENT_H,AGENT_W,AGENT_H);
    ctx.strokeStyle=isSelected?C.gold:isHovered?'#fff':'#aaa';
    ctx.lineWidth=isSelected?2:1;
    ctx.strokeRect(ax-AGENT_W/2,ay-AGENT_H,AGENT_W,AGENT_H);
    ctx.fillStyle=C.face;
    ctx.fillRect(ax-AGENT_W/2+3,ay-AGENT_H+6,AGENT_W-6,10);
    ctx.fillStyle=C.gold;
    ctx.font='8px Consolas';
    ctx.textAlign='center';
    ctx.fillText('↓',ax,ay-AGENT_H-4);
    ctx.fillStyle=isSelected?C.gold:'#fff';
    ctx.fillText(agent.name,ax,ay+8);
    const statusIcon={working:'💻',idle:'🟡',resting:'😴'}[agent.status]||'⬜';
    ctx.font='10px Arial';
    ctx.fillText(statusIcon,ax+AGENT_W/2+8,ay-AGENT_H+12);
    ctx.textAlign='left';
    clickables.push({x:ax-AGENT_W/2,y:ay-AGENT_H,w:AGENT_W,h:AGENT_H+20,action:'agent',agent:agent,tooltip:`${agent.name} (${agent.profession})\n状态: ${agent.status}\n能量: ${agent.energy}%\n情绪: ${agent.mood}%\n点击查看详情`});
  });
}

// ===== 菜单 =====
function canvasRectToViewport(item){
  const r=canvas.getBoundingClientRect();
  const sx=r.width/W,sy=r.height/H;
  return{x:r.left+item.x*sx,y:r.top+item.y*sy,w:item.w*sx,h:item.h*sy};
}

function showMenu(key,btnRect){
  if(menuOpen===key){closeMenu();return;}
  menuOpen=key;
  const menu=MENUS[key];
  if(!menu)return;
  let html=`<div class="menu-header">${menu.label}</div>`;
  menu.items.forEach(item=>{
    if(item.type==='separator'){html+='<div class="menu-separator"></div>';}
    else{
      const disabled=item.enabled===false;
      const tooltipText=item.tooltip||item.reason||item.label;
      html+=`<div class="menu-item ${disabled?'disabled':''}" onclick="${disabled?'':`handleMenuClick('${item.id}')`}" onmouseenter="showTT(event,'${tooltipText.replace(/'/g,"\\'")}')" onmouseleave="hideTT()"><span>${item.label}</span>${item.hotkey?`<span class="menu-hotkey">${item.hotkey}</span>`:''}${item.submenu?'<span style="margin-left:auto;">▶</span>':''}</div>`;
    }
  });
  document.getElementById('menuPopup').innerHTML=html;
  document.getElementById('menuPopup').style.display='block';
  document.getElementById('menuPopup').style.visibility='hidden';
  const measured=document.getElementById('menuPopup').getBoundingClientRect();
  let left=btnRect.x+btnRect.w/2-measured.width/2;
  left=Math.max(8,Math.min(left,window.innerWidth-measured.width-8));
  let top=btnRect.y-measured.height-8;
  if(top<8)top=btnRect.y+btnRect.h+8;
  document.getElementById('menuPopup').style.left=left+'px';
  document.getElementById('menuPopup').style.top=top+'px';
  document.getElementById('menuPopup').style.visibility='visible';
}

window.handleMenuClick=function(id){
  if(actions[id]){actions[id]();}
  else{log(`未实现: ${id}`);closeMenu();}
};
window.showTT=function(e,text){tooltip.innerHTML=text.replace(/\n/g,'<br>');tooltip.style.display='block';tooltip.style.left=(e.clientX+15)+'px';tooltip.style.top=(e.clientY+15)+'px';};
window.hideTT=function(){tooltip.style.display='none';};

// ===== 主循环 =====
function render(){
  clickables=[];
  rect(0,0,W,H,C.bg);
  drawTopBar();
  drawLeftPanel();
  drawRightPanel();
  drawBottomBar();
  drawBuilding();
  if(Math.random()<0.003){
    const parts=state.time.split(':');
    let h=parseInt(parts[0]),m=parseInt(parts[1]);
    m+=5;if(m>=60){m=0;h++;}if(h>=24){h=0;state.day++;}
    state.time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }
  state.tasks.forEach(task=>{
    if(task.status==='in_progress'&&task.progress<100){
      const agent=state.agents.find(a=>a.id===task.assignee);
      const speed=agent?.speed||1;
      task.progress+=Math.random()*0.2*speed;
      if(task.progress>=100){task.progress=100;task.status='completed';log(`${task.name} 已完成！`);if(agent){agent.status='idle';state.money+=10+Math.floor(Math.random()*20);state.lordXP+=5;}}
    }
  });
  hoveredItem=null;
  for(const item of clickables){if(mouseX>=item.x&&mouseX<=item.x+item.w&&mouseY>=item.y&&mouseY<=item.y+item.h){hoveredItem=item;break;}}
  canvas.style.cursor=hoveredItem?'pointer':'default';
  if(hoveredItem&&hoveredItem.tooltip){tooltip.style.display='block';tooltip.style.left=(parseFloat(canvas.style.left)+mouseX*parseFloat(canvas.style.width)/W+10)+'px';tooltip.style.top=(parseFloat(canvas.style.top)+mouseY*parseFloat(canvas.style.height)/H+10)+'px';tooltip.innerHTML=hoveredItem.tooltip.replace(/\n/g,'<br>');}else{tooltip.style.display='none';}
  requestAnimationFrame(render);
}

// ===== 事件 =====
canvas.addEventListener('mousemove',(e)=>{const rect2=canvas.getBoundingClientRect();mouseX=(e.clientX-rect2.left)*W/rect2.width;mouseY=(e.clientY-rect2.top)*H/rect2.height;});

canvas.addEventListener('click',(e)=>{
  const rect2=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect2.left)*W/rect2.width;
  const my=(e.clientY-rect2.top)*H/rect2.height;
  for(const item of clickables){if(mx>=item.x&&mx<=item.x+item.w&&my>=item.y&&my<=item.y+item.h){handleClick(item);break;}}
});

function handleClick(item){
  switch(item.action){
    case 'selectAgent':selectedAgent=item.agent;selectedTask=null;log(`选中了 ${item.agent.name}`);break;
    case 'agent':selectedAgent=item.agent;openPopup('agentDetail');break;
    case 'selectTask':selectedTask=item.task;log(`选中了任务: ${item.task.name}`);openPopup('taskDetail');break;
    case 'moveAgent':if(selectedAgent){selectedAgent.location=item.room;log(`${selectedAgent.name} → ${item.room}`);}break;
    case 'room':if(selectedAgent){selectedAgent.location=item.roomName;log(`${selectedAgent.name} → ${item.roomName}`);}break;
    case 'focusInput':inputFocused=true;break;
    case 'new':openPopup('newTask');break;
    case 'assign':if(selectedTask&&selectedAgent){selectedTask.assignee=selectedAgent.id;selectedTask.status='in_progress';selectedAgent.status='working';log(`分配 ${selectedTask.name} 给 ${selectedAgent.name}`);}break;
    case 'skill':openPopup('skillPanel');break;
    default:if(item.action.startsWith('menu_')){showMenu(item.menuKey,canvasRectToViewport(item));}
  }
}

document.addEventListener('keydown',(e)=>{
  if(inputFocused){
    if(e.key==='Enter'){if(inputText.trim()){log('> '+inputText);const cmd=inputText.toLowerCase();if(cmd.includes('去')||cmd.includes('移动')){const agent=state.agents.find(a=>cmd.includes(a.name));const room=state.rooms.find(r=>cmd.includes(r));if(agent&&room){agent.location=room;log(`${agent.name} → ${room}`);}}inputText='';}inputFocused=false;}
    else if(e.key==='Backspace'){inputText=inputText.slice(0,-1);}
    else if(e.key.length===1){inputText+=e.key;}e.preventDefault();
  }else if(e.key==='Escape'){selectedAgent=null;selectedTask=null;closeMenu();}
  else if(e.key===' '){e.preventDefault();log(state.pause?'▶ 游戏继续':'⏸️ 游戏暂停');state.pause=!state.pause;}
});

document.addEventListener('click',(e)=>{
  if(!e.target.closest('canvas')&&!e.target.closest('.menu-popup')&&!e.target.closest('.popup-overlay')){inputFocused=false;closeMenu();}
});

document.querySelectorAll('.popup-overlay').forEach(overlay=>{overlay.addEventListener('click',(e)=>{if(e.target===overlay)closePopup();});});

log('欢迎来到Hermes数字工作室');
log('点击Agent查看详情,点击房间移动');
render();
</script>
</body>
</html>
