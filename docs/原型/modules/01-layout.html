    padding: 8px 16px;
    color: #FFD700;
    font-size: 11px;

// ===== 基础绘图函数 =====
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function stroke(x, y, w, h, color, lw = 1) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.strokeRect(x, y, w, h);
}

function text(str, x, y, color, size = 12, align = 'left') {
  ctx.fillStyle = color;
  ctx.font = size + 'px Consolas';
  ctx.textAlign = align;
  ctx.fillText(str, x, y);
}

function btn(x, y, w, h, label) {
  rect(x, y, w, h, C.button);
  stroke(x, y, w, h, C.border);
  text(label, x + w/2, y + h/2 + 3, C.bright, 10, 'center');

function drawTopBar() {
  rect(0, 0, W, LAYOUT.top, C.top);
  stroke(0, 0, W, LAYOUT.top, C.border, 2);
  
  text('🏠 Hermes数字工作室', 15, 28, C.gold, 14);
  text('第 1 天  08:30', 200, 28, C.text, 11);
  
  const agentIcons = ['👑', '🤖', '🎨', '💻', '📊', '🔍'];
  const startX = W / 2 - (agentIcons.length * 36) / 2;
  agentIcons.forEach((icon, i) => {
    const ax = startX + i * 38;
    const ay = 6;
    ctx.beginPath();
    ctx.arc(ax + 16, ay + 16, 16, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#4169E1' : '#2a2a4a';
    ctx.fill();
    ctx.lineWidth = i === 0 ? 2 : 1;
    ctx.strokeStyle = i === 0 ? C.gold : C.border;
    ctx.stroke();
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, ax + 16, ay + 16);
    ctx.beginPath();
    ctx.arc(ax + 26, ay + 26, 4, 0, Math.PI * 2);
    ctx.fillStyle = i < 2 ? '#90EE90' : '#FFD700';
    ctx.fill();
  });
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  
  text('💰 1,250', 1400, 20, C.gold, 11);
  text('⚡ 85%', 1400, 36, '#90EE90', 11);
  text('👥 6', 1490, 20, C.text, 11);
  text('📋 3', 1490, 36, C.text, 11);
}

    text(t.n, x+16, ty+16, C.bright, 11);
    rect(x+16, ty+26, 140, 6, '#333');
    rect(x+16, ty+26, 140*t.p/100, 6, t.c);
    text(t.p+'%', x+160, ty+32, C.text, 9);
  });
  
  text('▶ 日志', x+12, LAYOUT.top + 230, C.bright, 12);
  logs.forEach((l, i) => {
    text(l.time + ' ' + l.msg, x+12, LAYOUT.top + 255 + i*18, '#888', 9);
  });
}

// ===== 底栏（带完整菜单系统）=====
function drawBottomBar() {
  const y = H - LAYOUT.bottom;
  rect(0, y, W, LAYOUT.bottom, C.bottom);
  stroke(0, y, W, LAYOUT.bottom, C.border, 2);

  const menuKeys = ['agent', 'task', 'social', 'building', 'lord', 'event', 'help'];
  let menuX = 15;

  menuKeys.forEach(key => {
    const menu = MENUS[key];
    if (!menu) return;

    const btnW = key === 'help' ? 70 : 75;
    const isOpen = menuOpen === key;
    const isHovered = hoveredItem && hoveredItem.action === `menu_${key}`;

    rect(menuX, y + 10, btnW, 34, isOpen ? '#3a4a6a' : isHovered ? C.btnHover : C.button);
    stroke(menuX, y + 10, btnW, 34, isOpen ? C.gold : isHovered ? '#fff' : C.border, isOpen ? 2 : 1);

    ctx.fillStyle = isOpen ? C.gold : C.bright;
    ctx.font = '10px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(menu.label, menuX + btnW/2, y + 31);
    ctx.textAlign = 'left';

    clickables.push({
      x: menuX, y: y + 10, w: btnW, h: 34,
      action: `menu_${key}`,
      menuKey: key,
      tooltip: `${menu.label.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '')} 菜单`
    });

    menuX += btnW + 5;
  });

  const statusY = y + 24;
  text(`第 ${state.day} 天`, W/2 - 80, statusY, C.text, 11, 'center');
  text(state.time, W/2 - 10, statusY, C.gold, 12, 'center');
  text(`👑 Lv.${state.lordLevel}`, W/2 + 60, statusY, C.gold, 11, 'center');
  text(`💰 ${state.money}`, W/2 + 130, statusY, '#FFD700', 11, 'center');
  text(`XP: ${state.lordXP}`, W/2 + 190, statusY, C.text, 10, 'center');

  if (state.pause) {
    rect(W/2 + 240, statusY - 14, 60, 20, 'rgba(255,0,0,0.3)');
    text('⏸️', W/2 + 270, statusY, '#FF6B6B', 11, 'center');
  }
}

// ===== 中央区域 =====
function drawCenter() {
  rect(CENTER_X, CENTER_Y, CENTER_W, CENTER_H, C.bg);
  stroke(CENTER_X, CENTER_Y, CENTER_W, CENTER_H, C.border, 2);
  
  text('中央区域 - 建筑渲染', CENTER_X + CENTER_W/2, CENTER_Y + CENTER_H/2, '#555', 14, 'center');
  text('基于PRD完整菜单系统已集成', CENTER_X + CENTER_W/2, CENTER_Y + CENTER_H/2 + 30, '#444', 10, 'center');
}

// ===== 菜单显示 ======
function canvasRectToViewport(item) {
  const r = canvas.getBoundingClientRect();
  const sx = r.width / W;
  const sy = r.height / H;
  return {
    x: r.left + item.x * sx,
    y: r.top + item.y * sy,
    w: item.w * sx,
    h: item.h * sy,
  };
}

function showMenu(key, btnRect) {
  if (menuOpen === key) {
    closeMenu();
    return;
  }

  menuOpen = key;
  currentSubMenu = null;

  const menu = MENUS[key];
  if (!menu) return;

  let html = `<div class="menu-header">${menu.label}</div>`;

  menu.items.forEach(item => {
    if (item.type === 'separator') {
      html += '<div class="menu-separator"></div>';
    } else {
      const disabled = item.enabled === false;
      const tooltipText = item.tooltip || item.reason || item.label;

      html += `<div class="menu-item ${disabled ? 'disabled' : ''}"
                   onclick="${disabled ? '' : `handleItemClick('${item.id}')`}"
                   onmouseenter="showTooltip(event, '${tooltipText.replace(/'/g, "\\'")}')"
                   onmouseleave="hideTooltip()">
                <span>${item.label}</span>
                ${item.hotkey ? `<span class="menu-hotkey">${item.hotkey}</span>` : ''}
                ${item.submenu ? '<span style="margin-left:auto;">▶</span>' : ''}
              </div>`;
    }
  });

  menuPopup.innerHTML = html;
  menuPopup.style.display = 'block';
  menuPopup.style.visibility = 'hidden';
  menuPopup.style.left = '0px';
  menuPopup.style.top = '0px';

  const measured = menuPopup.getBoundingClientRect();
  const popupW = measured.width;
  const popupH = measured.height;

  let left = btnRect.x + btnRect.w / 2 - popupW / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popupW - 8));

  let top = btnRect.y - popupH - 8;
  if (top < 8) {
    top = btnRect.y + btnRect.h + 8;
  }
  if (top + popupH > window.innerHeight - 8) {
    top = Math.max(8, window.innerHeight - popupH - 8);
  }

  menuPopup.style.left = left + 'px';
  menuPopup.style.top = top + 'px';
  menuPopup.style.visibility = 'visible';
}

window.handleItemClick = function(id) {
  const menu = MENUS[menuOpen];
  const item = menu.items.find(i => i.id === id);

  if (item && item.submenu) {
    showSubMenu(item.submenu);
  } else if (item && item.toggle && id === 'pause') {
    actions.pause();
  } else if (actions[id]) {
    actions[id]();
  } else {
    log(`未实现: ${id}`);
    closeMenu();
  }
};

function showSubMenu(subKey) {
  const subMenu = SUB_MENUS[subKey];
  if (!subMenu) return;

  currentSubMenu = subKey;

  let html = `<div class="menu-header">${subMenu.label}</div>`;

  subMenu.items.forEach(item => {
    const tooltipText = item.tooltip || item.label;
    html += `<div class="menu-item"
                 onclick="handleSubItemClick('${item.id}')"
                 onmouseenter="showTooltip(event, '${tooltipText.replace(/'/g, "\\'")}')"
                 onmouseleave="hideTooltip()">
              <span>${item.label}</span>
              ${item.hotkey ? `<span class="menu-hotkey">${item.hotkey}</span>` : ''}
            </div>`;
  });

  menuPopup.innerHTML = html;
  menuPopup.style.visibility = 'hidden';
  menuPopup.style.left = '0px';
  menuPopup.style.top = '0px';

  const measured = menuPopup.getBoundingClientRect();
  const popupW = measured.width;
  const popupH = measured.height;

  let left = 8;
  let top = 8;
  const menuBtn =
    menuOpen && clickables.length
      ? clickables.find((c) => c.menuKey === menuOpen && c.action === `menu_${menuOpen}`)
      : null;
  if (menuBtn) {
    const vr = canvasRectToViewport(menuBtn);
    left = vr.x + vr.w / 2 - popupW / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - popupW - 8));
    top = vr.y - popupH - 8;
    if (top < 8) top = vr.y + vr.h + 8;
    if (top + popupH > window.innerHeight - 8) {
      top = Math.max(8, window.innerHeight - popupH - 8);
    }
  }

  menuPopup.style.left = left + 'px';
  menuPopup.style.top = top + 'px';
  menuPopup.style.visibility = 'visible';
}

window.handleSubItemClick = function(id) {
  if (actions[id]) {
    actions[id]();
  } else {
    log(`未实现: ${id}`);
    closeMenu();
  }
};

window.showTooltip = function(e, text) {
  tooltip.innerHTML = text.replace(/\n/g, '<br>');
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 15) + 'px';
  tooltip.style.top = (e.clientY + 15) + 'px';
};

window.hideTooltip = function() {
  tooltip.style.display = 'none';
};

// ===== 事件处理 =====
canvas.addEventListener('mousemove', (e) => {
  const rect2 = canvas.getBoundingClientRect();
  const scaleX = W / rect2.width;
  const scaleY = H / rect2.height;
  mouseX = (e.clientX - rect2.left) * scaleX;
  mouseY = (e.clientY - rect2.top) * scaleY;

  hoveredItem = null;
  for (const item of clickables) {
    if (mouseX >= item.x && mouseX <= item.x + item.w &&
        mouseY >= item.y && mouseY <= item.y + item.h) {
      hoveredItem = item;
      break;
    }
  }

  canvas.style.cursor = hoveredItem ? 'pointer' : 'default';
});

canvas.addEventListener('click', (e) => {
  const rect2 = canvas.getBoundingClientRect();
  const scaleX = W / rect2.width;
  const scaleY = H / rect2.height;
  const mx = (e.clientX - rect2.left) * scaleX;
  const my = (e.clientY - rect2.top) * scaleY;

  for (const item of clickables) {
    if (mx >= item.x && mx <= item.x + item.w &&
        my >= item.y && my <= item.y + item.h) {
      if (item.action.startsWith('menu_')) {
        const key = item.menuKey;
        showMenu(key, canvasRectToViewport(item));
      }
      break;
    }
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('canvas') && !e.target.closest('.menu-popup')) {
    closeMenu();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeMenu();
  }
  if (e.key === ' ' && !e.target.closest('input')) {
    e.preventDefault();
    actions.pause();
  }
});

// ===== 主渲染 =====
function render() {
  clickables = [];
  rect(0, 0, W, H, C.bg);

  drawTopBar();
  drawBottomBar();
  drawCenter();
  drawRightPanel();

  requestAnimationFrame(render);
}

// ===== 初始化日志 =====
log('底部菜单系统已就绪');
log('点击菜单查看功能');

// 导出给其他模块用
window.LAYOUT = LAYOUT;
window.CENTER_X = CENTER_X;
window.CENTER_Y = CENTER_Y;
window.CENTER_W = CENTER_W;
window.CENTER_H = CENTER_H;
window.C = C;
window.rect = rect;
window.stroke = stroke;
window.text = text;
window.btn = btn;
window.MENUS = MENUS;
window.actions = actions;
window.state = state;

render();
</script>
