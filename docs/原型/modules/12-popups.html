<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Hermes数字工作室 - 弹出窗口设计</title>
<style>
  * { margin: 0; padding: 0; }
  body { 
    background: #0a0a15; 
    color: #eee; 
    font-family: Consolas, 'Microsoft YaHei', monospace;
    overflow: hidden;
  }
  #ui { display: block; }
  
  /* 弹出窗口 */
  .popup-overlay {
    position: fixed;
    top: 0; left: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: stretch;
    align-items: flex-end;
    padding: 0 0 3px 0;
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 1000;
  }
  .popup-overlay.show { display: flex; }

  .agent-detail-main-grid {
    overflow: auto;
  }
  
  .popup {
    background: #1a1a30;
    border: 2px solid #FFD700;
    border-radius: 12px 12px 0 0;
    border-bottom: 2px solid #FFD700;
    width: 100%;
    max-width: 100%;
    height: min(41%, calc(100% - 8px));
    max-height: calc(100% - 8px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.45);
    box-sizing: border-box;
  }
  
  .popup-header {
    background: #252540;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .popup-title {
    color: #FFD700;
    font-size: 14px;
    font-weight: bold;
  }
  .popup-close {
    color: #888;
    font-size: 18px;
    cursor: pointer;
    padding: 0 8px;
  }
  .popup-close:hover { color: #FFD700; }
  .popup-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .popup-header-btn {
    display: none;
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid #3a7a3a;
    background: #2a5a2a;
    color: #fff;
    cursor: pointer;
  }
  .popup-header-btn:hover { background: #3a6a3a; }
  
  .popup-content {
    padding: 16px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    box-sizing: border-box;
  }
  .popup-content::-webkit-scrollbar { width: 6px; }
  .popup-content::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  
  .popup-footer {
    padding: 12px 16px;
    border-top: 1px solid #333;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  
  /* 按钮 */
  .btn {
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    border: 1px solid #444;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #2a5a2a;
    color: #fff;
    border-color: #3a7a3a;
  }
  .btn-primary:hover { background: #3a6a3a; }
  .btn-secondary {
    background: #2a3a5a;
    color: #ccc;
  }
  .btn-secondary:hover { background: #3a4a6a; }
  .btn-danger {
    background: #5a2a2a;
    color: #ff6b6b;
    border-color: #7a3a3a;
  }
  .btn-danger:hover { background: #6a3a3a; }
  
  /* 表单元素 */
  .form-group {
    margin-bottom: 12px;
  }
  .form-label {
    display: block;
    color: #aaa;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .form-input {
    width: 100%;
    padding: 8px 12px;
    background: #0a0a15;
    border: 1px solid #333;
    border-radius: 4px;
    color: #fff;
    font-size: 12px;
    box-sizing: border-box;
  }
  .form-input:focus {
    outline: none;
    border-color: #FFD700;
    box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.15);
  }
  .form-textarea {
    width: 100%;
    padding: 10px 12px;
    background: #0a0a15;
    border: 1px solid #333;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    line-height: 1.5;
    box-sizing: border-box;
    resize: vertical;
  }
  .form-textarea:focus {
    outline: none;
    border-color: #FFD700;
    box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.15);
  }
  .form-select {
    width: 100%;
    padding: 8px 12px;
    background: #0a0a15;
    border: 1px solid #333;
    border-radius: 4px;
    color: #fff;
    font-size: 12px;
  }
  
  /* 列表 */
  .list-item {
    padding: 10px 12px;
    background: #252540;
    border-radius: 4px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .list-item:hover { background: #2a2a4a; }
  .list-item.selected { background: #3a4a6a; border: 1px solid #FFD700; }
  
  /* 标签页 */
  .tabs {
    display: flex;
    border-bottom: 1px solid #333;
    margin-bottom: 16px;
  }
  .tab {
    padding: 8px 16px;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-size: 12px;
  }
  .tab:hover { color: #ccc; }
  .tab.active { color: #FFD700; border-bottom-color: #FFD700; }
  
  /* 进度条 */
  .progress-bar {
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #228B22;
    transition: width 0.3s;
  }
  .progress-fill.warning { background: #FF8C00; }
  .progress-fill.danger { background: #DC143C; }
  
  /* 属性条 */
  .stat-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }
  .stat-label {
    width: 60px;
    font-size: 10px;
    color: #888;
  }
  .stat-bar-inner {
    flex: 1;
    height: 6px;
    background: #333;
    border-radius: 3px;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .stat-value {
    width: 35px;
    font-size: 10px;
    color: #aaa;
    text-align: right;
  }
  
  /* 标签 */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    margin-right: 4px;
  }
  .tag-green { background: #1a3a1a; color: #90EE90; }
  .tag-blue { background: #1a2a3a; color: #87CEEB; }
  .tag-yellow { background: #3a3a1a; color: #FFD700; }
  .tag-red { background: #3a1a1a; color: #ff6b6b; }
  .tag-purple { background: #2a1a3a; color: #DDA0DD; }
  
  /* 网格 */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  
  /* 工具提示 */
  .tooltip {
    position: fixed;
    background: rgba(26,26,48,0.95);
    border: 1px solid #FFD700;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 11px;
    pointer-events: none;
    display: none;
    z-index: 1001;
    color: #fff;
    max-width: 300px;
  }

  /* Agent 详情弹窗内 Tab（原在内联 HTML 中，避免 innerHTML 不执行 script） */
  .tab-btn {
    flex: none;
    padding: 10px 12px;
    background: transparent;
    border: none;
    color: #888;
    font-size: 11px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: #ccc; }
  .tab-btn.active {
    color: #FFD700;
    border-bottom-color: #FFD700;
    background: #1a1a30;
  }
  .tab-content { min-height: 120px; }
</style>
</head>
<body>
<canvas id="ui"></canvas>

<!-- 弹出窗口容器 -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup" id="popupContent">
    <div class="popup-header">
      <span class="popup-title" id="popupTitle">标题</span>
      <div class="popup-header-actions">
        <button type="button" class="popup-header-btn" id="popupHeaderActionBtn">添加</button>
        <span class="popup-close" onclick="closePopup()">×</span>
      </div>
    </div>
    <div class="popup-content" id="popupBody">内容</div>
    <div class="popup-footer" id="popupFooter"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const canvas = document.getElementById('ui');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1000;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.style.position = 'absolute';
  canvas.style.left = (window.innerWidth - W * scale) / 2 + 'px';
  canvas.style.top = (window.innerHeight - H * scale) / 2 + 'px';
  syncOverlayToCanvas();
}

function syncOverlayToCanvas() {
  const overlay = document.getElementById('popupOverlay');
  const rect = canvas.getBoundingClientRect();
  overlay.style.left = `${rect.left}px`;
  overlay.style.top = `${rect.top}px`;
  overlay.style.width = `${rect.width}px`;
  overlay.style.height = `${rect.height}px`;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const C = {
  bg: '#0a0a15', panel: '#1a1a30', border: '#333355',
  text: '#aaa', bright: '#fff', gold: '#FFD700',
  green: '#228B22', blue: '#4169E1', purple: '#9370DB',
  orange: '#FF8C00', red: '#DC143C',
};

let clickables = [];
let mouseX = 0, mouseY = 0;
let hoveredItem = null;
let currentPopup = null;

const state = {
  agents: [
    { id: 'A', name: '阿猿', profession: '程序员', status: 'working', energy: 75, mood: 80, affection: 60, relation: 45 },
    { id: 'B', name: '小美', profession: '设计师', status: 'idle', energy: 90, mood: 75, affection: 55, relation: 40 },
    { id: 'C', name: '点点', profession: '测试员', status: 'resting', energy: 60, mood: 85, affection: 70, relation: 50 },
    { id: 'D', name: '数据帝', profession: '分析师', status: 'working', energy: 55, mood: 70, affection: 65, relation: 48 },
  ],
  tasks: [
    { id: 1, name: '设计登录页面', progress: 65, status: 'in_progress', difficulty: 2, reward: 100 },
    { id: 2, name: '编写API接口', progress: 30, status: 'pending', difficulty: 4, reward: 200 },
    { id: 3, name: '测试支付模块', progress: 80, status: 'in_progress', difficulty: 3, reward: 150 },
  ],
  selectedAgent: null,
  selectedTask: null,
};

// ===== 弹出窗口定义 =====
const POPUPS = {
  // 1. Agent详情
  agentDetail: {
    title: '👥 Agent详情',
    width: 520,
    render: () => {
      const agent = state.selectedAgent || {};
      // 情绪等级判定
      const moodLevel = agent.mood >= 80 ? '兴奋' : agent.mood >= 60 ? '积极' : agent.mood >= 40 ? '平静' : agent.mood >= 20 ? '低落' : '焦躁';
      const moodEmoji = agent.mood >= 80 ? '😄' : agent.mood >= 60 ? '😊' : agent.mood >= 40 ? '😐' : agent.mood >= 20 ? '😔' : '😤';
      const moodColor = agent.mood >= 80 ? '#90EE90' : agent.mood >= 60 ? '#98FB98' : agent.mood >= 40 ? '#FFD700' : agent.mood >= 20 ? '#FFA500' : '#FF6347';
      
      // 状态图标
      const statusIcons = { idle: '💤', walking: '🚶', working: '💻', resting: '☕', social: '💬', chatting: '💬', collaborating: '🤝', slacking: '😤', offline: '⚫' };
      
      // 关系阶段
      const relationStage = agent.relation >= 71 ? '挚友' : agent.relation >= 31 ? '朋友' : agent.relation >= 11 ? '认识' : '陌生';
      const stageColor = agent.relation >= 71 ? '#FF69B4' : agent.relation >= 31 ? '#90EE90' : agent.relation >= 11 ? '#87CEEB' : '#888';
      
      // 属性图标列表
      const stats = [
        { icon: '⚡', label: '能量', value: agent.energy || 0, color: '#228B22' },
        { icon: moodEmoji, label: '情绪', value: agent.mood || 0, color: moodColor },
        { icon: '💬', label: '社交', value: agent.socialNeed || 50, color: '#DDA0DD' },
        { icon: '🎯', label: '专注', value: agent.focus || 80, color: '#4169E1' },
        { icon: '😴', label: '睡意', value: agent.sleepiness || 10, color: '#8B4513' },
        { icon: '🍔', label: '饱食', value: agent.satiety || 80, color: '#FF8C00' }
      ];
      
      return `
        <!-- 主内容区：左侧头像 + 右侧Tab -->
        <div style="display:grid;grid-template-columns:230px 1fr;gap:16px;height:340px;">
          
          <!-- 左侧：头像+职业+状态+位置 -->
          <div style="text-align:center;background:#252540;border-radius:8px;padding:16px;display:flex;flex-direction:column;overflow:hidden;">
            <div style="width:72px;height:72px;background:#4169E1;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;flex-shrink:0;">
              🤖
              <span style="position:absolute;bottom:0;right:0;font-size:14px;">${(agent.gender || 'male') === 'female' ? '👩' : (agent.gender || 'male') === 'male' ? '👨' : '⚧'}</span>
            </div>
            <div style="color:#fff;font-size:15px;font-weight:bold;">${agent.name || '未选择'}</div>
            <div style="color:#888;font-size:11px;margin:2px 0;">👤 ${agent.profession || ''}</div>
            
            <!-- 状态信息 -->
            <div style="margin-top:8px;flex:1;overflow-y:auto;text-align:left;">
              <!-- 状态+位置 -->
              <div style="background:#1a1a30;padding:6px;border-radius:4px;margin-bottom:6px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                  <span style="color:#fff;font-size:10px;">💼 状态</span>
                  <span style="color:#90EE90;font-size:10px;">工作中</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#fff;font-size:10px;">📍 位置</span>
                  <span style="color:#87CEEB;font-size:10px;">城主办公室</span>
                </div>
              </div>
              
              <!-- 推理模型 -->
              <div style="background:#1a1a30;padding:6px;border-radius:4px;margin-bottom:6px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#fff;font-size:10px;">🧠 推理</span>
                  <select onchange="updateReasoningModel(this.value)" style="background:#252540;color:#fff;border:1px solid #333;border-radius:3px;padding:2px 4px;font-size:9px;cursor:pointer;">
                    <option value="auto" selected>Auto</option>
                    <option value="reasoning">Reasoning</option>
                    <option value="balanced">Balanced</option>
                    <option value="instant">Instant</option>
                  </select>
                </div>
              </div>
              
              <!-- 职业能力 -->
              <div style="color:#666;font-size:9px;margin-bottom:4px;">💼 职业能力</div>
              <div style="background:#1a1a30;padding:6px;border-radius:4px;margin-bottom:4px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
                  <span style="color:#fff;font-size:9px;">🔥 代码</span>
                  <span style="color:#90EE90;font-size:9px;">Lv.5</span>
                </div>
                <div style="height:4px;background:#333;border-radius:2px;"><div style="width:75%;height:100%;background:#228B22;border-radius:2px;"></div></div>
              </div>
              <div style="background:#1a1a30;padding:6px;border-radius:4px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
                  <span style="color:#fff;font-size:9px;">💬 沟通</span>
                  <span style="color:#FFD700;font-size:9px;">Lv.4</span>
                </div>
                <div style="height:4px;background:#333;border-radius:2px;"><div style="width:60%;height:100%;background:#FF8C00;border-radius:2px;"></div></div>
              </div>
            </div>
          </div>
          
          <!-- 右侧：Tab页面 -->
          <div style="background:#1a1a30;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;">
            <!-- Tab标签 -->
            <div style="display:flex;background:#252540;border-radius:8px 8px 0 0;border-bottom:1px solid #333;flex-shrink:0;justify-content:flex-start;">
              <button type="button" class="tab-btn active" data-tab="basic" onclick="switchAgentDetailTab(this)">📋 基本</button>
              <button type="button" class="tab-btn" data-tab="config" onclick="switchAgentDetailTab(this)">⚙️ 配置</button>
              <button type="button" class="tab-btn" data-tab="skill" onclick="switchAgentDetailTab(this)">⭐ 技能</button>
              <button type="button" class="tab-btn" data-tab="task" onclick="switchAgentDetailTab(this)">📋 任务</button>
              <button type="button" class="tab-btn" data-tab="achieve" onclick="switchAgentDetailTab(this)">🏆 成就</button>
              <button type="button" class="tab-btn" data-tab="relation" onclick="switchAgentDetailTab(this)">❤️ 关系</button>
            </div>
            
            <!-- Tab内容区 -->
            <div style="flex:1;overflow-y:auto;padding:16px;min-height:0;">
              <!-- 基本信息 -->
              <div class="tab-content active" id="tab-basic">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <!-- 左侧：属性状态 -->
                  <div>
                    <div style="background:#0a0a15;padding:10px;border-radius:6px;">
                      ${stats.map(s => `
                        <div style="display:flex;align-items:center;margin-bottom:12px;" title="${s.label}: ${s.value}%">
                          <span style="font-size:18px;width:28px;text-align:center;flex-shrink:0;">${s.icon}</span>
                          <div style="flex:1;height:20px;background:#1a1a30;border-radius:10px;overflow:hidden;margin:0 10px;position:relative;">
                            <div style="width:${s.value}%;height:100%;background:${s.color};border-radius:10px;display:flex;align-items:center;padding-left:10px;">

                            </div>
                          </div>

                  </div>
                  
                  <!-- 右侧：口头禅/性格/梗/任务 -->
                  <div>
                    <div style="background:#0a0a15;padding:10px;border-radius:4px;margin-bottom:8px;">
                      <div style="color:#666;font-size:10px;margin-bottom:4px;">💬 口头禅</div>
                      <div style="color:#fff;font-size:12px;font-style:italic;">"${agent.catchphrase || '暂无口头禅'}"</div>
                    </div>
                    <div style="background:#0a0a15;padding:10px;border-radius:4px;margin-bottom:8px;">
                      <div style="color:#666;font-size:10px;margin-bottom:4px;">🧠 性格特点</div>
                      <div style="color:#aaa;font-size:11px;line-height:1.5;">${agent.personality || '暂无描述'}</div>
                    </div>
                    <div style="background:#0a0a15;padding:10px;border-radius:4px;margin-bottom:8px;">
                      <div style="color:#666;font-size:10px;margin-bottom:6px;">🎯 已解锁的梗</div>
                      <div style="display:flex;flex-wrap:wrap;gap:4px;">
                        ${(agent.memes || ['登录验证', '代码审查', '递归bug']).map(m => `<span style="background:#2a2a40;color:#aaa;padding:3px 8px;border-radius:10px;font-size:10px;">${m}</span>`).join('')}
                      </div>
                    </div>
                    <div style="background:#0a0a15;padding:10px;border-radius:4px;">
                      <div style="color:#666;font-size:10px;margin-bottom:4px;">📋 当前任务</div>
                      <div style="color:#90EE90;font-size:12px;">${agent.currentTask || '无'}</div>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- 配置 -->
              <div class="tab-content" id="tab-config" style="display:none;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <!-- soul.md -->
                  <div style="background:#0a0a15;border-radius:6px;padding:12px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                      <div style="display:flex;align-items:center;gap:6px;">
                        <span style="color:#fff;font-size:12px;font-weight:bold;">📝 soul.md</span>
                        <span style="color:#666;font-size:9px;">Agent灵魂设定</span>
                      </div>
                      <div style="display:flex;gap:4px;">
                        <button class="btn-icon" onclick="alert('编辑soul.md')" title="编辑" style="background:none;border:none;color:#87CEEB;cursor:pointer;font-size:14px;padding:2px 4px;">✏️</button>
                        <button class="btn-icon" onclick="alert('重置soul.md到Hermes初始状态')" title="重置" style="background:none;border:none;color:#90EE90;cursor:pointer;font-size:14px;padding:2px 4px;">🔄</button>
                      </div>
                    </div>
                    <div style="background:#1a1a30;padding:8px;border-radius:4px;max-height:120px;overflow-y:auto;">
                      <div style="color:#aaa;font-size:10px;line-height:1.5;white-space:pre-wrap;">我是阿猿，一名程序员。我喜欢写代码，对技术有热情。我说话直接，有时候会有点梗。</div>
                    </div>
                  </div>
                  
                  <!-- memory.md -->

  // 6. 关系图谱
  relationMap: {
    title: '🗺️ 关系图谱',
    width: 700,
    render: () => {
      const center = { x: 350, y: 130 };
      const radius = 110;
      const nodes = state.agents.map((a, i) => {
        const angle = (-Math.PI / 2) + (i * (Math.PI * 2 / state.agents.length));
        return { ...a, x: center.x + Math.cos(angle) * radius, y: center.y + Math.sin(angle) * radius };
      });
      const getRelStyle = (rel) => {
        if (rel >= 71) return { color: '#22c55e', width: 3, stage: '挚友' };
        if (rel >= 31) return { color: '#eab308', width: 2.3, stage: '朋友' };
        if (rel >= 11) return { color: '#f97316', width: 1.6, stage: '认识' };
        return { color: '#666', width: 1, stage: '陌生' };
      };
      const pairRelation = (a, b, ai, bi) => {
        const base = Math.round((a.relation + b.relation) / 2);
        const variance = ((ai + 1) * (bi + 2) * 7) % 14 - 7;
        return Math.max(0, Math.min(100, base + variance));
      };
      let svgInner = '';
      nodes.forEach((a, i) => {
        nodes.forEach((b, j) => {
          if (j <= i) return;
          const rel = pairRelation(a, b, i, j);
          const style = getRelStyle(rel);
          svgInner += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${style.color}" stroke-width="${style.width}" opacity="0.55"/>`;
        });
      });
      nodes.forEach((n) => {
        const style = getRelStyle(Math.min(100, Math.round((n.relation + 60) / 2)));
        svgInner += `<line x1="${center.x}" y1="${center.y}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${style.color}" stroke-width="1" opacity="0.22"/>`;
      });
      svgInner += `<circle cx="${center.x}" cy="${center.y}" r="22" fill="#4169E1" stroke="#FFD700" stroke-width="3"/>`;
      svgInner += `<text x="${center.x}" y="${center.y + 5}" text-anchor="middle" fill="#FFD700" font-size="18" font-family="Consolas,'Microsoft YaHei',sans-serif">👑</text>`;
      svgInner += `<text x="${center.x}" y="${center.y + 40}" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold" font-family="Consolas,'Microsoft YaHei',sans-serif">城主</text>`;
      nodes.forEach((n) => {
        const style = getRelStyle(n.relation);
        const nx = n.x.toFixed(1);
        const ny = n.y.toFixed(1);
        svgInner += `<circle cx="${nx}" cy="${ny}" r="18" fill="#2b2b3e" stroke="${style.color}" stroke-width="2"/>`;
        svgInner += `<text x="${nx}" y="${Number(ny) + 4}" text-anchor="middle" fill="#fff" font-size="12" font-family="Consolas,'Microsoft YaHei',sans-serif">${n.name[0]}</text>`;
        svgInner += `<text x="${nx}" y="${Number(ny) + 52}" text-anchor="middle" fill="#fff" font-size="10" font-family="Consolas,'Microsoft YaHei',sans-serif">${n.name}</text>`;
        svgInner += `<text x="${nx}" y="${Number(ny) + 66}" text-anchor="middle" fill="${style.color}" font-size="9" font-family="Consolas,'Microsoft YaHei',sans-serif">${style.stage}(${n.relation})</text>`;
      });
      return `
      <div style="position:relative;height:280px;background:#0a0a15;border-radius:8px;margin-bottom:12px;border:1px solid #2a2a45;">
        <svg width="100%" height="100%" viewBox="0 0 700 280" preserveAspectRatio="xMidYMid meet" style="display:block;">
          ${svgInner}
        </svg>
      </div>
      <div style="display:flex;justify-content:center;gap:16px;padding:6px;background:#1a2a3a;border-radius:4px;font-size:10px;flex-wrap:wrap;">
        <span style="color:#22c55e;">● 挚友 71-100</span>
        <span style="color:#eab308;">● 朋友 31-70</span>
        <span style="color:#f97316;">● 认识 11-30</span>
        <span style="color:#666;">● 陌生 0-10</span>
      </div>
      <div style="margin-top:12px;padding:10px;background:#0a0a15;border-radius:6px;color:#666;font-size:10px;line-height:1.5;">
        💡 协作任务的分工、参与人与加成已合并到「📋 任务详情」弹窗中；此处仅展示 Agent 关系网络。
      </div>
    `;
    },
    buttons: [{ label: '关闭', class: 'btn-secondary', action: 'close' }]
  },

// ===== 弹出窗口控制 =====
function openPopup(popupId) {
  const popup = POPUPS[popupId];
  if (!popup) return;

  if (popupId === 'agentDetail' && !state.selectedAgent) {
    state.selectedAgent = state.agents[0];
  }

  currentPopup = popupId;

  // 设置标题和副标题
  const titleEl = document.getElementById('popupTitle');
  if (popup.subtitle) {
    titleEl.innerHTML = popup.title + '<br><span style="color:#666;font-size:11px;font-weight:normal;">' + popup.subtitle + '</span>';
  } else {
    titleEl.textContent = popup.title;
  }
  document.getElementById('popupBody').innerHTML = popup.render();

  // 渲染底部按钮
  const footer = document.getElementById('popupFooter');
  footer.innerHTML = '';
  footer.style.display = 'none';
  if (popup.buttons && popup.buttons.length) {
    footer.style.display = 'flex';
    popup.buttons.forEach(btn => {
      const button = document.createElement('button');
      button.className = 'btn ' + btn.class;
      button.textContent = btn.label;
      button.onclick = () => {
        if (btn.action === 'close') {
          closePopup();
        } else if (actions[btn.action]) {
          actions[btn.action]();
        }
      };
      footer.appendChild(button);
    });
  }

  // 统一底部停靠全宽外框
  const overlay = document.getElementById('popupOverlay');
  const shell = document.getElementById('popupContent');
  shell.style.width = '';
  shell.style.height = '';

  syncOverlayToCanvas();
  overlay.classList.add('show');
}

function closePopup() {
  const overlay = document.getElementById('popupOverlay');
  overlay.classList.remove('show');
  const headerActionBtn = document.getElementById('popupHeaderActionBtn');
  headerActionBtn.style.display = 'none';
  headerActionBtn.onclick = null;
  currentPopup = null;
}

// ===== 绘制主界面 =====
function drawMainUI() {
  const LAYOUT = { top: 44, bottom: 56, left: 260, right: 260 };
  const y = H - LAYOUT.bottom;

  // 背景
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, 0, W, H);

  // 顶栏
  ctx.fillStyle = '#151525';
  ctx.fillRect(0, 0, W, LAYOUT.top);
  ctx.strokeStyle = '#333355';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W, LAYOUT.top);

  ctx.fillStyle = '#FFD700';
  ctx.font = '14px Consolas';
  ctx.fillText('Hermes数字工作室 - 弹出窗口设计', 15, 28);

  ctx.fillStyle = '#888';
  ctx.font = '11px Consolas';
  ctx.fillText('点击下方按钮打开对应弹出窗口', 400, 28);

  // 中央说明区
  ctx.fillStyle = 'rgba(26,26,48,0.95)';
  ctx.fillRect(LAYOUT.left + 50, 80, W - LAYOUT.left - LAYOUT.right - 100, H - 180);
  ctx.strokeStyle = '#333355';
  ctx.strokeRect(LAYOUT.left + 50, 80, W - LAYOUT.left - LAYOUT.right - 100, H - 180);

  ctx.fillStyle = '#FFD700';
  ctx.font = '14px Consolas';
  ctx.textAlign = 'center';
  ctx.fillText('📋 弹出窗口总览（基于PRD设计）', W/2, 115);

  const col1 = LAYOUT.left + 80;
  const col2 = W/2 + 20;
  let row = 150;
  const items = [
    { popup: 'agentDetail', label: '👥 Agent详情', desc: '查看Agent属性/状态' },
    { popup: 'addAgent', label: '➕ 添加Agent', desc: '通过Profile配置' },
    { popup: 'taskDetail', label: '📋 任务详情', desc: '进度、协作参与人与加成' },
    { popup: 'newTask', label: '➕ 新建任务', desc: '创建新任务' },
    { popup: 'taskCompetition', label: '🎲 任务竞争', desc: '纯随机抽签' },
    { popup: 'relationMap', label: '🗺️ 关系图谱', desc: 'Agent关系网络（协作分工见任务详情）' },
    { popup: 'skillPanel', label: '⭐ 城主技能', desc: '使用/升级技能' },
    { popup: 'buildingUpgrade', label: '🏠 基地升级', desc: '设施升级' },
    { popup: 'achievement', label: '🏆 成就系统', desc: '里程碑/奖励' },
    { popup: 'celebration', label: '🎉 庆功宴', desc: '全员buff' },
    { popup: 'review', label: '📝 任务复盘', desc: '经验总结' },
    { popup: 'weeklyGoal', label: '📅 周目标', desc: '周期性目标' },
    { popup: 'challenge', label: '⚡ 突发挑战', desc: '危机处理' },
    { popup: 'socialEvent', label: '💬 社交事件', desc: '打招呼/交流' },
    { popup: 'settings', label: '⚙️ 设置', desc: '游戏设置' },
    { popup: 'help', label: '📖 帮助手册', desc: '教程/快捷键' },
    { popup: 'snackMachine', label: '🍿 零食贩卖机', desc: '购买零食' },

  ];

  ctx.textAlign = 'left';
  items.forEach((item, i) => {
    const col = i < 9 ? col1 : col2;
    const r = i < 9 ? row + i * 45 : row + (i - 9) * 45;

    ctx.fillStyle = '#2a3a5a';
    ctx.fillRect(col, r, 350, 38);
    ctx.strokeStyle = '#444466';
    ctx.strokeRect(col, r, 350, 38);

    ctx.fillStyle = '#FFD700';
    ctx.font = '11px Consolas';
    ctx.fillText(item.label, col + 10, r + 16);

    ctx.fillStyle = '#888';
    ctx.font = '10px Consolas';
    ctx.fillText(item.desc, col + 10, r + 30);

    clickables.push({
      x: col, y: r, w: 350, h: 38,
      popup: item.popup,
      tooltip: `打开: ${item.label}`
    });
  });

  // 底部栏
  ctx.fillStyle = '#151525';
  ctx.fillRect(0, y, W, LAYOUT.bottom);
  ctx.strokeStyle = '#333355';
  ctx.strokeRect(0, y, W, LAYOUT.bottom);

  ctx.fillStyle = '#888';
  ctx.font = '10px Consolas';
  ctx.fillText('💡 点击上方按钮打开对应弹出窗口 | 按 ESC 关闭弹窗', 15, y + 24);

  // 日志
  const logX = W - LAYOUT.right;
  ctx.fillStyle = 'rgba(26,26,48,0.9)';
  ctx.fillRect(logX, LAYOUT.top, LAYOUT.right, H - LAYOUT.top - LAYOUT.bottom);
  ctx.strokeStyle = '#333355';
  ctx.strokeRect(logX, LAYOUT.top, LAYOUT.right, H - LAYOUT.top - LAYOUT.bottom);

  ctx.fillStyle = '#FFD700';
  ctx.font = '12px Consolas';
  ctx.fillText('📋 操作日志', logX + 12, LAYOUT.top + 25);

  logs.forEach((log, i) => {
    ctx.fillStyle = '#666';
    ctx.font = '9px Consolas';
    ctx.fillText(log.time, logX + 12, LAYOUT.top + 50 + i * 18);
    ctx.fillStyle = '#aaa';
    ctx.fillText(log.msg, logX + 70, LAYOUT.top + 50 + i * 18);
  });

  if (logs.length === 0) {
    log('弹出窗口系统已就绪');
    log('点击按钮打开窗口');
  }
}

// ===== 主循环 =====
function render() {
  clickables = [];
  drawMainUI();

  // 鼠标检测
  const rect2 = canvas.getBoundingClientRect();
  const scaleX = W / rect2.width;
  const scaleY = H / rect2.height;
  const mx = (mouseX - rect2.left) * scaleX;
  const my = (mouseY - rect2.top) * scaleY;

  hoveredItem = null;
  for (const item of clickables) {
    if (mx >= item.x && mx <= item.x + item.w && my >= item.y && my <= item.y + item.h) {
      hoveredItem = item;
      break;
    }
  }
  canvas.style.cursor = hoveredItem ? 'pointer' : 'default';

  requestAnimationFrame(render);
}

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('click', (e) => {
  const rect2 = canvas.getBoundingClientRect();
  const scaleX = W / rect2.width;
  const scaleY = H / rect2.height;
  const mx = (e.clientX - rect2.left) * scaleX;
  const my = (e.clientY - rect2.top) * scaleY;

  for (const item of clickables) {
    if (mx >= item.x && mx <= item.x + item.w && my >= item.y && my <= item.y + item.h) {
      if (item.popup) {
        openPopup(item.popup);
      }
      break;
    }
  }
});

render();
</script>
</body>
